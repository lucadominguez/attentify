<title>Attentify — Guarded Attention</title>
<style>
  html,body{margin:0;padding:0;background:#070912}
  svg{display:block}
</style>
<svg id="art" width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="38%" cy="52%" r="62%">
      <stop offset="0%"   stop-color="#221a52"/>
      <stop offset="46%"  stop-color="#120f2c"/>
      <stop offset="100%" stop-color="#06070f"/>
    </radialGradient>

    <!-- the dome: brightest where the noise strikes it -->
    <linearGradient id="domeStroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4c3fd6" stop-opacity=".25"/>
      <stop offset="42%"  stop-color="#8b7dff" stop-opacity=".85"/>
      <stop offset="72%"  stop-color="#38e0f0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="domeFill" cx="50%" cy="62%" r="52%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity=".16"/>
      <stop offset="70%"  stop-color="#4338ca" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity=".02"/>
    </radialGradient>

    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3d4585"/>
      <stop offset="55%"  stop-color="#2a3067"/>
      <stop offset="100%" stop-color="#171b3e"/>
    </linearGradient>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7dd3fc" stop-opacity=".95"/>
      <stop offset="55%"  stop-color="#818cf8" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- noise glyph fills: hot, saturated, deliberately louder than the calm side -->
    <linearGradient id="nA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/><stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="nB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="nC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
    <linearGradient id="nD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="tiny" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <!-- everything outside the dome is the storm; inside is quiet -->
    <!-- nothing of the body may show below the desk edge -->
    <clipPath id="aboveDesk"><rect x="0" y="0" width="1600" height="747"/></clipPath>
    <clipPath id="outsideDome">
      <path d="M0 0H1600V1000H0Z M600 540m-336 0a336 336 0 1 0 672 0a336 336 0 1 0-672 0Z" clip-rule="evenodd"/>
    </clipPath>

    <g id="glyphCard">
      <rect x="-34" y="-24" width="68" height="48" rx="9"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGlow)"/>

  <!-- faint grid: the machinery of the attention economy, kept almost subliminal -->
  <g opacity=".16" stroke="#5b5fd6" stroke-width="1">
    <path d="M0 120H1600M0 260H1600M0 400H1600M0 540H1600M0 680H1600M0 820H1600M0 960H1600"/>
    <path d="M120 0V1000M300 0V1000M480 0V1000M660 0V1000M840 0V1000M1020 0V1000M1200 0V1000M1380 0V1000M1560 0V1000"/>
  </g>

  <!-- ══ THE STORM ══ distraction glyphs streaming in from the upper right,
       drawn only outside the dome so the boundary does the storytelling ══ -->
  <g clip-path="url(#outsideDome)">
    <!-- motion trails -->
    <g stroke-linecap="round" fill="none" opacity=".5">
      <path d="M1520 120C1300 210 1130 300 1010 372" stroke="#f472b6" stroke-width="3" opacity=".5"/>
      <path d="M1560 300C1360 356 1180 420 1046 486" stroke="#fbbf24" stroke-width="3" opacity=".45"/>
      <path d="M1440 640C1290 626 1150 606 1030 596" stroke="#38bdf8" stroke-width="3" opacity=".45"/>
      <path d="M1180 860C1100 790 1020 712 962 660" stroke="#fb7185" stroke-width="3" opacity=".4"/>
      <path d="M700 60C744 160 800 250 858 320" stroke="#a78bfa" stroke-width="3" opacity=".45"/>
    </g>

    <!-- play buttons, like bubbles, notification bells, feed cards, ad rails -->
    <g>
      <g transform="translate(1490 108) rotate(-18)">
        <rect x="-40" y="-28" width="80" height="56" rx="11" fill="url(#nC)"/>
        <path d="M-9 -14L20 0L-9 14Z" fill="#fff" opacity=".92"/>
      </g>
      <g transform="translate(1330 196) rotate(12)">
        <rect x="-34" y="-24" width="68" height="48" rx="9" fill="url(#nA)"/>
        <path d="M0 12C-16 2-24 -6-24 -13a9 9 0 0 1 24-6a9 9 0 0 1 24 6c0 7-8 15-24 25Z" transform="scale(.62) translate(0 4)" fill="#fff" opacity=".92"/>
      </g>
      <g transform="translate(1178 292) rotate(-8)">
        <rect x="-46" y="-30" width="92" height="60" rx="10" fill="url(#nB)"/>
        <rect x="-34" y="-14" width="44" height="7" rx="3.5" fill="#fff" opacity=".85"/>
        <rect x="-34" y="1" width="60" height="7" rx="3.5" fill="#fff" opacity=".55"/>
      </g>
      <g transform="translate(1470 330) rotate(20)">
        <rect x="-30" y="-30" width="60" height="60" rx="15" fill="url(#nD)"/>
        <path d="M0 -13a11 11 0 0 1 11 11c0 9 4 12 4 12H-15s4-3 4-12A11 11 0 0 1 0 -13Z" fill="#fff" opacity=".9"/>
        <circle cx="0" cy="15" r="4" fill="#fff" opacity=".9"/>
      </g>
      <g transform="translate(1290 452) rotate(-14)">
        <rect x="-44" y="-26" width="88" height="52" rx="9" fill="url(#nC)"/>
        <path d="M-8 -12L18 0L-8 12Z" fill="#fff" opacity=".9"/>
      </g>
      <g transform="translate(1096 428) rotate(6)">
        <circle r="27" fill="url(#nA)"/>
        <path d="M0 12C-16 2-24 -6-24 -13a9 9 0 0 1 24-6a9 9 0 0 1 24 6c0 7-8 15-24 25Z" transform="scale(.6) translate(0 4)" fill="#fff" opacity=".92"/>
      </g>
      <g transform="translate(1418 556) rotate(-6)">
        <rect x="-48" y="-22" width="96" height="44" rx="8" fill="url(#nB)"/>
        <rect x="-36" y="-7" width="52" height="6" rx="3" fill="#fff" opacity=".8"/>
        <rect x="-36" y="5" width="30" height="6" rx="3" fill="#fff" opacity=".5"/>
      </g>
      <g transform="translate(1132 618) rotate(14)">
        <rect x="-32" y="-32" width="64" height="64" rx="16" fill="url(#nD)"/>
        <path d="M-10 -15L18 0L-10 15Z" fill="#fff" opacity=".9"/>
      </g>
      <g transform="translate(1252 742) rotate(-22)">
        <rect x="-40" y="-26" width="80" height="52" rx="9" fill="url(#nA)"/>
        <rect x="-28" y="-8" width="46" height="6" rx="3" fill="#fff" opacity=".8"/>
        <rect x="-28" y="4" width="26" height="6" rx="3" fill="#fff" opacity=".5"/>
      </g>
      <g transform="translate(1010 806) rotate(10)">
        <circle r="24" fill="url(#nC)"/>
        <path d="M-7 -10L15 0L-7 10Z" fill="#fff" opacity=".9"/>
      </g>
      <g transform="translate(834 118) rotate(-26)">
        <rect x="-38" y="-25" width="76" height="50" rx="9" fill="url(#nB)"/>
        <path d="M-7 -11L17 0L-7 11Z" fill="#fff" opacity=".9"/>
      </g>
      <g transform="translate(660 74) rotate(16)">
        <circle r="22" fill="url(#nD)"/>
        <path d="M0 10C-13 2-20 -5-20 -11a7.5 7.5 0 0 1 20-5a7.5 7.5 0 0 1 20 5c0 6-7 12-20 21Z" transform="scale(.55) translate(0 3)" fill="#fff" opacity=".9"/>
      </g>
      <g transform="translate(300 176) rotate(-12)">
        <rect x="-36" y="-24" width="72" height="48" rx="9" fill="url(#nA)"/>
        <path d="M-7 -11L16 0L-7 11Z" fill="#fff" opacity=".88"/>
      </g>
      <g transform="translate(150 420) rotate(8)">
        <rect x="-30" y="-30" width="60" height="60" rx="14" fill="url(#nC)"/>
        <path d="M0 -13a11 11 0 0 1 11 11c0 9 4 12 4 12H-15s4-3 4-12A11 11 0 0 1 0 -13Z" fill="#fff" opacity=".88"/>
        <circle cx="0" cy="15" r="4" fill="#fff" opacity=".88"/>
      </g>
      <g transform="translate(206 726) rotate(-16)">
        <rect x="-42" y="-24" width="84" height="48" rx="9" fill="url(#nB)"/>
        <rect x="-30" y="-7" width="44" height="6" rx="3" fill="#fff" opacity=".78"/>
        <rect x="-30" y="5" width="24" height="6" rx="3" fill="#fff" opacity=".5"/>
      </g>
    </g>
  </g>

  <!-- ══ IMPACT ══ where the storm meets the boundary and comes apart ══ -->
  <g filter="url(#tiny)">
    <g fill="#a5f3fc">
      <circle cx="936" cy="356" r="4.5" opacity=".95"/><circle cx="958" cy="392" r="3" opacity=".8"/>
      <circle cx="908" cy="322" r="3.5" opacity=".85"/><circle cx="964" cy="452" r="4" opacity=".9"/>
      <circle cx="936" cy="500" r="3" opacity=".75"/><circle cx="930" cy="620" r="4" opacity=".85"/>
      <circle cx="900" cy="676" r="3.2" opacity=".8"/><circle cx="852" cy="742" r="4.2" opacity=".9"/>
      <circle cx="806" cy="256" r="3.6" opacity=".8"/><circle cx="742" cy="228" r="3" opacity=".7"/>
      <circle cx="330" cy="352" r="3.4" opacity=".75"/><circle cx="286" cy="470" r="3" opacity=".7"/>
      <circle cx="322" cy="672" r="3.6" opacity=".75"/>
    </g>
    <g stroke="#67e8f9" stroke-width="2.4" stroke-linecap="round" opacity=".8" fill="none">
      <path d="M916 338l26-20"/><path d="M948 424l30-12"/><path d="M922 592l30 8"/>
      <path d="M836 726l20 26"/><path d="M796 268l-18 24"/><path d="M312 386l-24 16"/>
    </g>
  </g>

  <!-- ══ THE DOME ══ -->
  <circle cx="600" cy="540" r="336" fill="url(#domeFill)"/>
  <circle cx="600" cy="540" r="336" fill="none" stroke="url(#domeStroke)" stroke-width="3.5" filter="url(#soft)" opacity=".85"/>
  <circle cx="600" cy="540" r="336" fill="none" stroke="url(#domeStroke)" stroke-width="2.2"/>
  <circle cx="600" cy="540" r="322" fill="none" stroke="#a5f3fc" stroke-width="1" opacity=".22"/>

  <!-- ══ WHAT GETS THROUGH ══ the point of the product: it is a filter, not a
       wall. Two on-task things cross the boundary cleanly and stay calm. ══ -->
  <g opacity=".95">
    <path d="M1230 176C1080 250 960 330 872 404" stroke="#7dd3fc" stroke-width="2.5" fill="none" stroke-dasharray="7 9" opacity=".7"/>
    <g transform="translate(720 470) rotate(-8)">
      <rect x="-40" y="-28" width="80" height="56" rx="10" fill="#0f1733" stroke="#7dd3fc" stroke-width="2"/>
      <rect x="-26" y="-12" width="38" height="6" rx="3" fill="#7dd3fc" opacity=".95"/>
      <rect x="-26" y="1" width="52" height="6" rx="3" fill="#a5b4fc" opacity=".7"/>
      <rect x="-26" y="14" width="30" height="6" rx="3" fill="#a5b4fc" opacity=".45"/>
    </g>
    <path d="M1150 800C1010 760 900 706 836 654" stroke="#7dd3fc" stroke-width="2.5" fill="none" stroke-dasharray="7 9" opacity=".6"/>
    <g transform="translate(742 640) rotate(9)">
      <rect x="-36" y="-26" width="72" height="52" rx="10" fill="#0f1733" stroke="#7dd3fc" stroke-width="2"/>
      <path d="M-14 -9l-9 9 9 9M14 -9l9 9-9 9" stroke="#7dd3fc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ══ THE PERSON ══ calm, working, unbothered ══ -->
  <g>
    <ellipse cx="600" cy="812" rx="250" ry="26" fill="#4c1d95" opacity=".35" filter="url(#soft)"/>

    <!-- Seated in profile, facing the work. Drawn BEFORE the desk so the desk
         edge crosses in front of the body, which is what puts them behind it
         rather than growing out of it. -->
    <g clip-path="url(#aboveDesk)">
      <!-- torso: the back shoulder sits higher than the working shoulder, which
           is what stops a seated profile reading as a symmetrical pawn -->
      <path d="M543 596C541 566 562 546 594 545C624 544 646 566 654 600C670 648 676 704 674 790L512 790C510 700 524 644 543 596Z" fill="url(#figure)"/>
      <!-- head, overlapping the shoulders so no neck seam shows -->
      <circle cx="600" cy="500" r="50" fill="url(#figure)"/>
      <!-- upper arm to elbow to wrist, resting on the keyboard -->
      <path d="M642 606C642 606 684 638 702 676C710 694 712 712 712 722" stroke="url(#figure)" stroke-width="32" stroke-linecap="round" fill="none"/>
      <ellipse cx="716" cy="726" rx="18" ry="12.5" fill="#2a3067" transform="rotate(-14 716 726)"/>

      <!-- screen light wrapping the edge that faces the laptop -->
      <path d="M647 470a50 50 0 0 1 3 66" stroke="url(#rim)" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M651 599c14 34 22 74 21 122" stroke="url(#rim)" stroke-width="6" fill="none" stroke-linecap="round" opacity=".8"/>
      <path d="M700 672c9 16 13 34 13 46" stroke="url(#rim)" stroke-width="6" fill="none" stroke-linecap="round" opacity=".75"/>
      <!-- violet spill off the dome behind, so the back edge separates too -->
      <path d="M549 600c-19 44-32 104-33 176" stroke="#8b7dff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".5"/>
      <path d="M556 476a50 50 0 0 1 16-22" stroke="#8b7dff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".45"/>
    </g>

    <!-- desk, in front of the body -->
    <rect x="386" y="742" width="470" height="9" rx="4.5" fill="#141a35"/>
    <rect x="386" y="742" width="470" height="3" rx="1.5" fill="#5b64c9" opacity=".6"/>

    <!-- laptop -->
    <path d="M712 742l14-96h96l-6 96Z" fill="#101637"/>
    <path d="M726 646h96l-4 66h-100Z" fill="url(#screen)" opacity=".92"/>
    <g opacity=".55" fill="#0b1030">
      <rect x="740" y="660" width="52" height="5" rx="2.5"/>
      <rect x="740" y="672" width="66" height="5" rx="2.5"/>
      <rect x="740" y="684" width="38" height="5" rx="2.5"/>
    </g>
    <rect x="700" y="742" width="132" height="8" rx="4" fill="#1b2246"/>
    <ellipse cx="768" cy="690" rx="120" ry="86" fill="#22d3ee" opacity=".14" filter="url(#softer)"/>
  </g>

  <!-- the dome reads in front of the figure very faintly, like glass -->
  <circle cx="600" cy="540" r="336" fill="none" stroke="#a5f3fc" stroke-width="1.2" opacity=".25"/>
</svg>
